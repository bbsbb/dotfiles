---
- name: Install emacs from the official repo
  apt:
    name: emacs
    state: present
    update_cache: yes

- name: "Make sure the emacs configuration directory exists"
  file:
    path: "/home/{{ ssh.user }}/.emacs.d"
    state: directory
    mode: 0755
    owner: "{{ ssh.user }}"
    group: "{{ ssh.user }}"

- name: Add personal configuration.
  become: yes
  become_user: "{{ ssh.user }}"
  template:
    src: "init.el.j2"
    dest: "/home/{{ ssh.user }}/.emacs.d/init.el"
    mode: 0644
    owner: "{{ ssh.user }}"
    group: "{{ ssh.user }}"
